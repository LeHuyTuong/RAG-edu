services:
  backend:
    build: ./backend
    restart: on-failure
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - BACKEND_PORT=8080
      - MYSQL_URL=${MYSQL_URL}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - JPA_DDL_AUTO=${JPA_DDL_AUTO:-validate}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - FLYWAY_LOCATIONS=${FLYWAY_LOCATIONS:-classpath:db/migration}
      - FLYWAY_BASELINE_ON_MIGRATE=${FLYWAY_BASELINE_ON_MIGRATE:-false}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL}
      - UPLOAD_BASE_PATH=${UPLOAD_BASE_PATH}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-900}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-259200}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-20MB}
      - MAX_REQUEST_SIZE=${MAX_REQUEST_SIZE:-25MB}
    volumes:
      - uploaded_files:/app/uploads
    depends_on:
      rag-service:
        condition: service_started

  rag-service:
    build: ./rag-service
    ports:
      - "${RAG_PORT:-8001}:8001"
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemma}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL:-gemma-4-31b-it}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-gemini-embedding-001}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-768}
      - DEFAULT_CHUNK_SIZE=${DEFAULT_CHUNK_SIZE:-800}
      - DEFAULT_CHUNK_OVERLAP=${DEFAULT_CHUNK_OVERLAP:-120}
      - DEFAULT_TOP_K=${DEFAULT_TOP_K:-5}
      - SCORE_THRESHOLD=${SCORE_THRESHOLD:-0.5}

volumes:
  uploaded_files:
