server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: history-rag-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/history_rag}
    username: ${MYSQL_USER:history}
    password: ${MYSQL_PASSWORD:history_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
jwt:
  secret-key: ${JWT_SECRET_KEY:dev-secret-key-r4g-3du-2024-history-rag-system-abcdefgh}
  # 15 minutes
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900}
  # 3 days
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:259200}
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  auth:
    refresh-cookie:
      secure: ${REFRESH_COOKIE_SECURE:false}
  rag:
    base-url: ${RAG_SERVICE_URL:http://localhost:8001}
    request-timeout: ${RAG_SERVICE_REQUEST_TIMEOUT:300s}
  upload:
    base-path: ${UPLOAD_BASE_PATH:./uploads}
    internal-base-path: ${UPLOAD_INTERNAL_BASE_PATH:${UPLOAD_BASE_PATH:./uploads}}
  soft-delete:
    retention-days: ${SOFT_DELETE_RETENTION_DAYS:30}
    cron: ${SOFT_DELETE_CRON:0 0 2 * * *}
  document:
    review:
      enabled: ${DOCUMENT_REVIEW_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001}
